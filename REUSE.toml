version = 1

[[annotations]]
path = [
	".gitattributes",
	".gitignore",
	"CHANGELOG.md",
	"README.md",
	"appinfo/info.xml",
	"composer.json",
	"composer.lock",
	"docs/**",
	"img/**",
	"l10n/**",
	"tests/integration/fixtures/**",
]
precedence = "aggregate"

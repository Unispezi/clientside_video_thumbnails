name: Integration

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: integration-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        nextcloud: ['31', '32', '33', '34']

    name: Nextcloud ${{ matrix.nextcloud }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run integration tests
        run: tests/integration/run-docker.sh ${{ matrix.nextcloud }}

  summary:
    runs-on: ubuntu-latest
    needs: integration
    if: always()
    name: integration-summary
    steps:
      - name: Summary status
        run: if ${{ needs.integration.result != 'success' }}; then exit 1; fi

#
# Monthly pull requests for new versions of the pinned actions, the worker's npm packages and the
# Composer dev tools. The app itself ships no third-party code.
# Security fixes come independently of this schedule (Dependabot security updates, repo settings).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /worker
    schedule:
      interval: monthly
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: monthly
    ignore:
      # Tracks a stable branch; the psalm workflow installs the matching version per Nextcloud release anyway.
      - dependency-name: nextcloud/ocp
